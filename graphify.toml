# graphify-rs configuration
# These values serve as defaults and can be overridden by CLI flags.

# Output directory for graph files
# output = ".graphify"

# Disable legacy LLM-based semantic extraction. Local document context still runs.
# no_llm = true

# Explicitly enable legacy Anthropic document extraction (requires ANTHROPIC_API_KEY)
# anthropic_semantic = false

# Or enrich documents through an installed local LLM CLI instead of an API key.
# The command receives graphify's extraction prompt on stdin and must print JSON to stdout.
# llm = true
# llm_command = "graphify-llm-codex --model gpt-5.4-mini"
# llm_provider = "codex-cli"

# Only process code files (skip docs/papers)
# code_only = false

# Export formats (comma-separated). Available: json,html,architecture,likec4,graphml,cypher,svg,wiki,obsidian,report,context
# Leave empty or omit for all formats.
# formats = ["json", "html", "report"]

# Logical service name for architecture manifests and LikeC4 service diagrams.
# service_name = "my-service"

# LikeC4 export controls
# likec4_max_nodes = 250
# likec4_max_relations = 150
# likec4_detail = "balanced" # architecture | balanced | full
# likec4_include_paths = ["cmd/", "internal/", "pkg/"]
# likec4_exclude_paths = ["**/*.user.js", "docs/tmp/"]

# Semantic embedding backend for --embed: model2vec, ollama, or voyage
# embedding_provider = "model2vec"
# embedding_model = "minishlab/potion-code-16M"
